# Layer-7 load balancer for the scale-out Compose profile.
# least_conn suits a chat server: long-lived WebSockets make "connections"
# the real load unit, so route each new one to the least-loaded replica.
upstream cipherchat_backend {
    least_conn;
    # Docker's embedded DNS resolves the service name to every replica; nginx
    # re-resolves on reload. `zone` shares the connection counts across workers.
    zone backend 64k;
    server backend:8080 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    # WebSocket/STOMP endpoint: upgrade headers + a long read timeout
    # (the STOMP heartbeat is 25s; 1h is the outer bound for idle sockets).
    location /ws {
        proxy_pass http://cipherchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://cipherchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;     # correlation id if the client sent none
        client_max_body_size 12m;                       # matches spring.servlet.multipart.max-request-size
    }
}
