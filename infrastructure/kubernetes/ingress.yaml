# AWS Load Balancer Controller (ALB). Long-lived WebSockets need a raised
# idle timeout; TLS terminates at the ALB (ACM cert), pods speak plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cipherchat
  namespace: cipherchat
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
spec:
  rules:
    - host: api.chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cipherchat-backend
                port:
                  name: http
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cipherchat-frontend
                port:
                  name: http
