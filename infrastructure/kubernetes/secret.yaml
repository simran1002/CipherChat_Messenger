# TEMPLATE — do not commit real values. In AWS these come from Secrets
# Manager via External Secrets Operator (see terraform/ and docs/DEPLOYMENT.md);
# this file exists so `kubectl apply -k` works on a dev cluster with
# placeholder values you overwrite:
#   kubectl -n cipherchat create secret generic cipherchat-backend-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=SEAL_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_USER=cipherchat --from-literal=DATABASE_PASSWORD=... \
#     --from-literal=ANTHROPIC_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: cipherchat-backend-secrets
  namespace: cipherchat
type: Opaque
stringData:
  JWT_SECRET: "REPLACE-ME-at-least-32-bytes-of-randomness"
  SEAL_SECRET: "REPLACE-ME-at-least-32-bytes-of-randomness"
  DATABASE_USER: "cipherchat"
  DATABASE_PASSWORD: "REPLACE-ME"
  ANTHROPIC_API_KEY: ""
