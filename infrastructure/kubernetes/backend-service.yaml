apiVersion: v1
kind: Service
metadata:
  name: cipherchat-backend
  namespace: cipherchat
  labels:
    app.kubernetes.io/name: cipherchat-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cipherchat-backend
  ports:
    - name: http
      port: 80
      targetPort: http
  # No session affinity needed: WebSocket sessions are pinned to a pod by the
  # TCP connection itself; cross-pod fan-out goes through Redis pub/sub.
