# Horizontal scale-out demo: nginx (least_conn) → N stateless backend replicas
# sharing Postgres, Redis and Kafka. No sticky sessions: a WebSocket is pinned
# to whichever replica accepted the TCP connection, and every replica sees
# every room/DM/user event through Redis pub/sub.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build --scale backend=2
#
# Kill-a-pod test (automated: `python scripts/verify-failover.py`): SIGKILL one replica
# (`docker kill cipherchat-backend-1` — the container name, not the compose service name)
# while a client is mid-conversation; it reconnects to the survivor within seconds and
# nothing sent in between is lost or duplicated (idempotent on clientMessageId).
services:
  backend:
    # `ports: []` would NOT clear the base file's 8080:8080 — Compose appends lists when merging, so every
    # replica would still try to bind host port 8080 and collide with the LB. `!reset` really empties it.
    ports: !reset []                # only reachable through the LB
    deploy:
      replicas: 2
    environment:
      DB_POOL_SIZE: "10"            # per replica: 200 max_connections / replicas, with headroom
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infrastructure/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 6
