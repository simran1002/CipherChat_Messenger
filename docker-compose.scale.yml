# Horizontal scale-out demo: nginx (least_conn) → N stateless backend replicas
# sharing Postgres, Redis and Kafka. No sticky sessions: a WebSocket is pinned
# to whichever replica accepted the TCP connection, and every replica sees
# every room/DM/user event through Redis pub/sub.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build --scale backend=2
#
# Kill-a-pod test: open two browsers, `docker compose kill cipherchat-backend-1`,
# both clients reconnect to the survivor within a few seconds; nothing sent in
# between is lost (offline queue drains, idempotent on clientMessageId).
services:
  backend:
    ports: []                       # only reachable through the LB
    deploy:
      replicas: 2
    environment:
      DB_POOL_SIZE: "10"            # per replica: 200 max_connections / replicas, with headroom
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infrastructure/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 6
