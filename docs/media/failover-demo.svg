<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="820" height="520" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="820" height="34" rx="12" fill="#1f2937"/>
  <circle cx="20" cy="17" r="6" fill="#ef4444"/><circle cx="40" cy="17" r="6" fill="#f59e0b"/><circle cx="60" cy="17" r="6" fill="#22c55e"/>
  <text x="410" y="21" text-anchor="middle" fill="#9ca3af" font-size="12">chat-back — npm run demo:failover   (docker-compose.scale.yml · nginx ip_hash → backend1 + backend2 · Redis-coordinated)</text>

  <g fill="#e5e7eb">
    <text x="24" y="64"><tspan fill="#a78bfa">$</tspan> npm run demo:failover</text>
    <text x="24" y="88" fill="#93c5fd">→ target http://localhost:8080, 60 messages, stop backend2 (socket owner) at #30</text>
    <text x="24" y="110" fill="#9ca3af">  · 10/60</text>
    <text x="24" y="130" fill="#9ca3af">  · 20/60</text>
    <text x="24" y="152" fill="#fbbf24">  ✂  stopping backend2 at message #30</text>
    <text x="24" y="174" fill="#9ca3af">  · 30/60      <tspan fill="#6b7280">← in-flight message retries onto the surviving pod</tspan></text>
    <text x="24" y="194" fill="#9ca3af">  · 40/60</text>
    <text x="24" y="214" fill="#9ca3af">  · 50/60</text>
    <text x="24" y="234" fill="#9ca3af">  · 60/60</text>

    <text x="24" y="270" fill="#f3f4f6" font-weight="bold">Results</text>
    <text x="24" y="294"><tspan fill="#22c55e">  ✓</tspan> every message persisted exactly once — 60 rows / 60 unique of 60</text>
    <text x="24" y="316"><tspan fill="#22c55e">  ✓</tspan> sequence numbers gap-free &amp; increasing — 1…60   <tspan fill="#6b7280">(Redis INCR, seeded — across the pod switch)</tspan></text>
    <text x="24" y="338"><tspan fill="#22c55e">  ✓</tspan> Bob received every message exactly once — 60/60 unique, 0 duplicate events</text>
    <text x="24" y="360"><tspan fill="#22c55e">  ✓</tspan> server ACKed one id per message — 60 ids</text>
    <text x="24" y="386" fill="#d1d5db">  ACK latency p50 14ms · p95 19ms · max 2388ms   <tspan fill="#6b7280">← the failover gap</tspan></text>
    <text x="24" y="406" fill="#d1d5db">  retried sends: 30 · reconnects alice=1 bob=1</text>
    <text x="24" y="426" fill="#d1d5db">  pod stopped at #30; pipeline kept flowing for the remaining 31</text>
    <text x="24" y="446" fill="#9ca3af">  ↻ backend2 restarted</text>

    <text x="24" y="486" fill="#22c55e" font-weight="bold" font-size="15">PASS — zero lost, zero duplicated across failover</text>
  </g>
  <text x="796" y="508" text-anchor="end" fill="#4b5563" font-size="10">real output, 2026-08-22 · rendered as SVG (see docs/DEMO.md to reproduce live)</text>
</svg>
