# Load balancer for the horizontal-scaling demo (docker-compose.scale.yml).
#
# ip_hash gives sticky sessions: Socket.IO's HTTP long-polling fallback needs
# every request of a session to hit the same pod (websocket-only clients
# wouldn't strictly need it, but the fallback must keep working). Message
# fan-out BETWEEN pods travels over the Redis adapter, not through nginx.
upstream backend {
    ip_hash;
    server backend1:8000;
    server backend2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
    }
}
