# Load balancer for the horizontal-scaling demo (docker-compose.scale.yml).
#
# ip_hash gives sticky sessions: Socket.IO's HTTP long-polling fallback needs
# every request of a session to hit the same pod. Message fan-out BETWEEN
# pods travels over the Redis adapter, not through nginx.
#
# Websocket-only deployments don't need stickiness at all — see
# nginx-lb-ws.conf + docker-compose.scale.leastconn.yml for the least_conn
# profile that trades the polling fallback for true connection-count
# balancing.
#
# Failover tuning (open-source nginx has passive health checks only):
# - max_fails=2 / fail_timeout=5s: a pod is sidelined after two failed
#   connects and re-probed 5s later — short enough that a restarted pod
#   rejoins quickly, long enough to stop hammering a dead one.
# - proxy_connect_timeout 2s: a stopped container's IP goes unreachable; the
#   kernel default (~3s ARP/route failure) plus nginx defaults made the first
#   request after a kill wait several seconds before trying the next pod.
# - proxy_next_upstream: retry the *other* pod on connect errors/timeouts
#   (safe: the app's dedup layer makes replayed sends idempotent).
upstream backend {
    ip_hash;
    server backend1:8000 max_fails=2 fail_timeout=5s;
    server backend2:8000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 90s;
    }
}
