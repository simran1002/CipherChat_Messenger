# least_conn load balancer — WEBSOCKET-ONLY profile.
#
# Socket.IO only needs sticky sessions for its HTTP long-polling fallback
# (every poll of a session must hit the pod that owns it). When clients are
# built websocket-only (VITE_SOCKET_TRANSPORTS=websocket), a session is one
# upgraded TCP connection, so any pod can take it — and least_conn spreads
# load by actual connection count instead of ip_hash's client-IP bucketing
# (which pins every user behind one office NAT to the same pod).
#
# Trade-off (why this is a separate profile, not the default): clients that
# can't establish a WebSocket — restrictive corporate proxies, some captive
# portals — have no polling fallback and cannot connect at all.
#
# Use via the override file:
#   docker compose -f docker-compose.scale.yml -f docker-compose.scale.leastconn.yml up --build
#
# Failover tuning is identical to nginx-lb.conf (see comments there).
upstream backend {
    least_conn;
    server backend1:8000 max_fails=2 fail_timeout=5s;
    server backend2:8000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 90s;
    }
}
