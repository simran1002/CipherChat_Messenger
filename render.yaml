# Render Blueprint — deploy configuration as code (see docs/DEPLOYMENT.md § Render).
# Docker runtime: the image pins Java 21, so the build no longer depends on
# Render's Node toolchain or on commands typed into the dashboard.
services:
  - type: web
    name: cipherchat-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true       # Render deploys every push to main; set false and use deploy hooks for CI-gated deploys
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod,nokafka                     # free tier: no Kafka broker. Drop 'nokafka' and add KAFKA_BOOTSTRAP_SERVERS when one exists
      # Render exposes postgres://… connection strings; JDBC needs jdbc:postgresql://host:port/db,
      # so the parts are passed separately and application.yaml assembles the JDBC URL.
      - key: DATABASE_HOST
        fromDatabase:
          name: cipherchat-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: cipherchat-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: cipherchat-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: cipherchat-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: cipherchat-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cipherchat-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEAL_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS                # the frontend's hostname; the app adds https://
        fromService:
          type: web
          name: cipherchat-frontend
          property: host
      - key: STORAGE_DRIVER
        value: local                            # demo only; set s3 + S3_* for anything durable
      - key: UPLOAD_DIR
        value: /tmp/uploads                     # free instances have no persistent disk: uploads survive until the next deploy
      - key: AI_BASE_URL
        sync: false                             # any chat-completions endpoint; blank disables AI
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: LOG_FORMAT
        value: ecs
  - type: web
    name: cipherchat-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./chat-front/Dockerfile
    dockerContext: ./chat-front
    healthCheckPath: /healthz
    autoDeploy: true       # Render deploys every push to main; set false and use deploy hooks for CI-gated deploys
    envVars:
      - key: VITE_API_URL                       # baked at image build: the backend's hostname, the client adds https://
        fromService:
          type: web
          name: cipherchat-backend
          property: host

  - type: keyvalue
    name: cipherchat-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                             # internal only

databases:
  - name: cipherchat-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
