# Override: websocket-only clients behind a least_conn load balancer.
# Compose merges this over docker-compose.scale.yml:
#
#   docker compose -f docker-compose.scale.yml -f docker-compose.scale.leastconn.yml up --build
#   (or: npm run stack:scale:ws)
#
# Why it works: without the HTTP long-polling fallback there is nothing
# session-affine between client and pod, so the LB can drop ip_hash sticky
# sessions and balance by live connection count. See deploy/nginx-lb-ws.conf
# for the trade-off (no fallback for proxy-restricted clients).
services:
  lb:
    volumes:
      - ./deploy/nginx-lb-ws.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./chat-front
      args:
        VITE_API_URL: http://localhost:8080
        VITE_SOCKET_TRANSPORTS: websocket
