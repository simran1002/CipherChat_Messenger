# Version updates: monthly, one grouped PR per ecosystem, at most two open at a time.
# Major bumps are excluded everywhere — those are decisions taken deliberately, not maintenance. Security updates are separate (Settings → Code security) and
# keep arriving as soon as an advisory matches a dependency.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maven-all:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /chat-front
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, frontend]

  - package-ecosystem: docker
    directories: [/backend, /chat-front]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, ci]
