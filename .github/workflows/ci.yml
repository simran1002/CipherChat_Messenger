name: CI

# Every push and pull request: static analysis → tests → security → images.
# main additionally publishes images (tags: <sha>, main) and deploys to staging.
# Releases (tags v*) are handled by release.yml; deploys by deploy.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  TRIVY_VERSION: v0.74.0     # pinned: the installer no longer serves the action's older default
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cipherchat-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cipherchat-frontend

jobs:
  # ── 1. Backend: formatting → unit → integration (Testcontainers) → coverage gate ──
  backend:
    name: Backend · build, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Formatting & unused imports (Spotless)
        run: ./mvnw -B -q -ntp spotless:check
      # verify = unit tests (surefire) → integration tests (failsafe, Testcontainers on the
      # runner's Docker daemon) → merged JaCoCo report + coverage gate, in one lifecycle so
      # the gate sees the merged exec file.
      - name: Unit + integration tests, coverage gate
        run: ./mvnw -B -ntp verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  # ── 2. Frontend: lint → typecheck → unit → build ────────────────────────────
  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: chat-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: chat-front/dist
          retention-days: 7

  # ── 3. Dependency vulnerabilities (SCA) on the source tree ──────────────────
  sca:
    name: Security · dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Trivy resolves Maven parent/transitive POMs from Maven Central at scan time and gets
      # rate-limited (HTTP 429) on shared runners. Populate ~/.m2 once, then scan offline.
      - name: Resolve the Maven dependency tree locally
        working-directory: backend
        run: ./mvnw -B -q -ntp dependency:go-offline
      - name: Trivy filesystem scan (Maven + npm lockfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── 4. Infrastructure as code: manifests, Terraform, Compose all validate ───
  manifests:
    name: Infra · kubeconform, terraform validate, compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Kubernetes manifests against the 1.30 schemas
        run: |
          docker run --rm -v "$PWD/infrastructure/kubernetes:/k" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.30 -ignore-missing-schemas /k
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform fmt + validate (no cloud credentials needed)
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Compose files parse under every profile
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.scale.yml config -q

  # ── 5. Container images: build → scan → push (push only on main) ────────────
  images:
    name: Images · build, scan, push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/cipherchat-backend
          - name: frontend
            context: ./chat-front
            image: ghcr.io/${{ github.repository_owner }}/cipherchat-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # ── 6. Staging: every green main goes out automatically ──────────────────────
  deploy-staging:
    name: Deploy · staging
    needs: [images, sca, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: sha-${{ github.sha }}
      git_ref: ${{ github.sha }}
    secrets: inherit
