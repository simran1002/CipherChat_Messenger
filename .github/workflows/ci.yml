name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cipherchat-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cipherchat-frontend

jobs:
  # ── 1. Backend: static analysis → unit → integration (Testcontainers) → coverage ──
  backend:
    name: Backend · build, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Formatting & unused imports (Spotless)
        run: ./mvnw -B -q spotless:check
      # verify = unit tests (surefire) → integration tests (failsafe, Testcontainers on the
      # runner's Docker daemon) → merged JaCoCo report + coverage gate, in one lifecycle so
      # the gate sees the merged exec file.
      - name: Unit + integration tests, coverage gate
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  # ── 2. Frontend: lint → typecheck → unit → build ────────────────────────────
  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: chat-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: chat-front/dist
          retention-days: 7

  # ── 3. Dependency vulnerabilities (OWASP-style SCA) on the source tree ──────
  sca:
    name: Security · dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy filesystem scan (Maven + npm lockfiles)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── 4. Container images: build, scan, push (push only on the default branch) ──
  images:
    name: Images · build, scan, push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/cipherchat-backend
          - name: frontend
            context: ./chat-front
            image: ghcr.io/${{ github.repository_owner }}/cipherchat-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

  # ── 5. Deploy: gated environment; wires the pushed tag into the k8s overlay ──
  deploy:
    name: Deploy · Kubernetes (manual approval)
    runs-on: ubuntu-latest
    needs: [images, sca]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production            # requires reviewers in repo settings → Environments
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Point kubectl at EKS
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME || 'cipherchat' }}
      - name: Roll out
        working-directory: infrastructure/kubernetes
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/cipherchat-backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/cipherchat-frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          kubectl apply -k .
          kubectl -n cipherchat rollout status deployment/cipherchat-backend --timeout=5m
          kubectl -n cipherchat rollout status deployment/cipherchat-frontend --timeout=3m
